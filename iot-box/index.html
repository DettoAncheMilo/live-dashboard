<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PitWall">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GiroVeloce Commander</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #151515;
            --border: #333;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-yellow: #ffcc00;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- FEEDBACK VISIVO INVIO (ANIMAZIONE INFALLIBILE) --- */
        #flashOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99999;
            box-shadow: inset 0 0 0 0 transparent;
        }

        @keyframes flashAnim {
            0% { box-shadow: inset 0 0 0 20px var(--flash-color); }
            100% { box-shadow: inset 0 0 0 0 transparent; }
        }

        .flash-active {
            animation: flashAnim 0.4s ease-out;
        }

        /* --- HEADER & STATUS --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
            border-bottom: 2px solid var(--border);
            z-index: 100;
            position: relative;
        }

        #sessionStatus { font-weight: 800; font-size: 0.88rem; flex-grow: 1; line-height: 1.3; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        #pairStatus { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        
        .btn-icon {
            background: none; border: none; color: var(--text-main);
            font-size: 1.35rem; width: 44px; height: 44px; padding: 5px; cursor: pointer;
        }

        /* Selezione sempre visibile: sul telefono evita di aprire le impostazioni a ogni cambio target. */
        #selectionBar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
            padding: 8px 10px;
            background: #101010;
            border-bottom: 1px solid var(--border);
        }
        .selection-field { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .selection-field label { color: var(--text-muted); font-size: 0.68rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
        .selection-field select { min-height: 46px; padding: 8px 28px 8px 10px; font-size: .83rem; }
        #driverSelectionHint { grid-column: 1 / -1; margin: 0; font-size: .75rem; line-height: 1.35; color: var(--accent-yellow); }

        /* --- SETTINGS PANEL --- */
        #settingsPanel {
            position: absolute;
            top: 100%; 
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--accent-blue);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 70dvh;
            overflow-y: auto; 
            z-index: 90;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform: translateY(0);
            opacity: 1;
        }

        #settingsPanel.collapsed { 
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }

        .input-group { display: flex; gap: 8px; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            background-color: #000; color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; font-family: inherit; font-weight: 700; font-size: 16px;
        }
        button {
            font-family: inherit; font-weight: 900;
            border: none; border-radius: 6px; padding: 12px; cursor: pointer;
            text-transform: uppercase; color: #000; transition: 0.2s;
            touch-action: manipulation;
        }
        #loadBtn { background-color: var(--accent-yellow); flex-shrink: 0; width: 82px; }
        #stopBtn { background-color: var(--accent-red); color: #fff; display: none; }

        #mainContentWrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* --- LIVE TIMING TABLE --- */
        #liveTimingContainer {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            background-color: var(--bg-dark);
            width: 100%;
        }

        table { width: 100%; min-width: 350px; table-layout: fixed; border-collapse: collapse; text-align: left; font-size: 0.84rem; }
        thead th { 
            position: sticky; 
            top: 0; 
            background-color: var(--bg-dark); 
            z-index: 10;
            padding: 9px 4px;
            height: 40px;
            font-weight: 900; 
            color: var(--text-muted); 
            border-bottom: 2px solid var(--border); 
            font-size: 0.67rem;
        }

        td { padding: 11px 4px; border-bottom: 1px solid #222; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .col-pos { width: 34px; text-align: center; }
        .col-num { width: 40px; color: var(--accent-yellow); text-align: center; }
        .col-name { width: auto; }
        .col-last { width: 66px; color: var(--text-main); }
        .col-best { width: 66px; color: var(--accent-cyan); }
        .col-gap { width: 58px; }

        #emptyState { padding: 28px 20px; color: var(--text-muted); text-align: center; line-height: 1.5; font-size: .9rem; }
        #emptyState[hidden] { display: none; }
        
        .pinned-row {
            position: sticky;
            z-index: 9;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            border-bottom: 1px solid #444;
        }

        .row-me { background-color: rgba(255, 204, 0, 0.15); border-left: 4px solid var(--accent-yellow); }
        .row-me.pinned-row { background-color: #2a2200 !important; }

        .row-target { background-color: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--accent-blue); }
        .row-target.pinned-row { background-color: #001a33 !important; }

        /* --- BOTTOM CONTROLS --- */
        #bottomControls {
            background-color: var(--panel-bg);
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            border-top: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .quick-btns { display: flex; gap: 7px; }
        .quick-btns button { flex: 1; min-height: 52px; padding: 8px 3px; font-size: clamp(.68rem, 3.4vw, .82rem); }
        .btn-push { background-color: var(--accent-green); }
        .btn-behind { background-color: var(--accent-yellow); }
        .btn-box { background-color: var(--accent-red); color: #fff; }

        .custom-msg { display: flex; gap: 7px; }
        .custom-msg input[type="text"] { flex-grow: 1; min-width: 0; }
        .custom-msg input[type="color"] { 
            width: 50px; height: 43px; padding: 2px; 
            border: 1px solid var(--border); border-radius: 6px; background: #000;
        }
        .custom-msg button { background-color: #f97316; color: #fff; width: 72px; }
        #customMessageDetails summary { min-height: 38px; display: flex; align-items: center; justify-content: center; color: #bbb; font-weight: 800; font-size: .76rem; cursor: pointer; list-style: none; }
        #customMessageDetails summary::-webkit-details-marker { display: none; }
        #customMessageDetails summary::before { content: '＋'; margin-right: 6px; color: var(--accent-yellow); }
        #customMessageDetails[open] summary::before { content: '−'; }
        #customMessageDetails .custom-msg { padding-top: 4px; }

        @media (min-width: 700px) {
            body { max-width: 760px; margin: 0 auto; border-left: 1px solid #222; border-right: 1px solid #222; }
            #selectionBar { padding: 10px 14px; }
            table { font-size: .95rem; }
            thead th { font-size: .78rem; padding: 12px 8px; }
            td { padding: 13px 8px; }
            .quick-btns button { font-size: .95rem; }
        }
    </style>
</head>
<body>

    <!-- Overlay per l'effetto Flash di invio -->
    <div id="flashOverlay"></div>

    <!-- Header -->
    <header>
        <div id="sessionStatus" aria-live="polite">⏱️ --:-- | 🔄 -</div>
        <div class="header-actions">
            <span id="pairStatus">UNPAIRED</span>
            <button class="btn-icon" id="toggleSettingsBtn" aria-label="Open settings" aria-expanded="false" onclick="toggleSettings()">⚙️</button>
        </div>
        
        <div id="settingsPanel" class="collapsed">
            <div class="input-group">
                <input type="text" id="deviceIdInput" placeholder="Display ID (PIT-XXXX)" aria-label="Display ID" autocomplete="off" onchange="pairDevice()">
                <input type="text" id="myRaceNumber" placeholder="My rider #" aria-label="My rider number" inputmode="numeric">
            </div>
            <div class="input-group">
                <input type="text" id="raceLinkInput" placeholder="Paste race link (FICR, MYLAPS, MGM, Time2Race)" aria-label="Race link" autocomplete="url">
                <button id="loadBtn" onclick="loadNewRace()">LOAD</button>
            </div>
            <button id="stopBtn" onclick="stopSession()">STOP SESSION</button>
        </div>
    </header>

    <section id="selectionBar" aria-label="Rider and target selection">
        <div class="selection-field">
            <label for="driverSelect">My rider</label>
            <select id="driverSelect" aria-label="Select my rider" aria-describedby="driverSelectionHint"><option value="">Select rider</option></select>
        </div>
        <div class="selection-field">
            <label for="targetSelect">Target</label>
            <select id="targetSelect" aria-label="Select target"><option value="">No target</option></select>
        </div>
        <p id="driverSelectionHint" role="status" hidden></p>
    </section>

    <div id="mainContentWrapper">
        <div id="liveTimingContainer">
            <div id="emptyState" role="status">Load a race in Settings. The standings will appear here; then select your rider.</div>
            <table id="liveTimingTable">
                <thead>
                    <tr>
                        <th class="col-pos">POS</th>
                        <th class="col-num">#</th>
                        <th class="col-name">NAME</th>
                        <th>LAST</th>
                        <th>BEST</th>
                        <th>GAP</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div id="bottomControls">
        <div class="quick-btns">
            <button class="btn-push" aria-label="Send PUSH command" onclick="sendPitCommand('PUSH', '#00FF00')">PUSH</button>
            <button class="btn-behind" aria-label="Send rider-behind alert" onclick="sendPitCommand('RIDER BEHIND', '#FFCC00')">RIDER BEHIND</button>
            <button class="btn-box" aria-label="Send BOX command" onclick="sendPitCommand('BOX', '#FF0000')">BOX</button>
        </div>
        <details id="customMessageDetails">
            <summary>Custom message</summary>
            <div class="custom-msg">
                <input type="text" id="customTextInput" placeholder="Type a message..." aria-label="Custom message" maxlength="19">
                <input type="color" id="customColorPicker" value="#ff8800" aria-label="Message color">
                <button aria-label="Send custom message" onclick="sendCustomMessage()">SEND</button>
            </div>
        </details>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <script src="app.js?v=20261025-link2"></script>
</body>
</html>
