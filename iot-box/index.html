<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PitWall">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GiroVeloce Commander</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #151515;
            --border: #333;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-yellow: #ffcc00;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- FEEDBACK VISIVO INVIO --- */
        #flashOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            box-shadow: inset 0 0 0 0 transparent;
            transition: box-shadow 0.4s ease-out;
        }
        
        /* QUESTA È LA REGOLA CHE MANCAVA */
        body.flash-border #flashOverlay {
            box-shadow: inset 0 0 0 15px var(--flash-color); /* Spessore del bordo flash */
            transition: box-shadow 0s; /* Appare istantaneamente, poi sfuma nei 0.4s scritti sopra */
        }

        /* --- HEADER & STATUS --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: calc(env(safe-area-inset-top) + 15px) 15px 15px 15px;
            border-bottom: 2px solid var(--border);
            z-index: 100;
            position: relative;
        }

        #sessionStatus { font-weight: 700; font-size: 0.9rem; flex-grow: 1; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        #pairStatus { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        
        .btn-icon {
            background: none; border: none; color: var(--text-main);
            font-size: 1.5rem; padding: 5px; cursor: pointer;
        }

        /* --- SETTINGS PANEL --- */
        #settingsPanel {
            position: absolute;
            top: 100%; 
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--accent-blue);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh; 
            overflow-y: auto; 
            z-index: 90;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform: translateY(0);
            opacity: 1;
        }

        #settingsPanel.collapsed { 
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }

        .input-group { display: flex; gap: 8px; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            background-color: #000; color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; font-family: 'Montserrat', sans-serif; font-weight: 700;
        }
        button {
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            border: none; border-radius: 6px; padding: 12px; cursor: pointer;
            text-transform: uppercase; color: #000; transition: 0.2s;
        }
        #loadBtn { background-color: var(--accent-yellow); flex-shrink: 0; width: 100px; }
        #stopBtn { background-color: var(--accent-red); color: #fff; display: none; }

        #mainContentWrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* --- LIVE TIMING TABLE --- */
        #liveTimingContainer {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            background-color: var(--bg-dark);
            width: 100%;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        thead { position: sticky; top: 0; background-color: var(--bg-dark); z-index: 10; }
        th { padding: 12px 8px; font-weight: 900; color: var(--text-muted); border-bottom: 2px solid var(--border); font-size: 0.8rem; }
        td { padding: 12px 8px; border-bottom: 1px solid #222; font-weight: 700; white-space: nowrap; }

        .col-pos { width: 40px; text-align: center; }
        .col-num { width: 40px; color: var(--accent-yellow); text-align: center; }
        .col-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .col-time { color: var(--text-main); }
        .col-best { color: var(--accent-cyan); }
        
        .row-me { background-color: rgba(255, 204, 0, 0.15); border-left: 4px solid var(--accent-yellow); }
        .row-target { background-color: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--accent-blue); }

        /* --- BOTTOM CONTROLS --- */
        #bottomControls {
            background-color: var(--panel-bg);
            padding: 10px 15px 15px 15px;
            border-top: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-btns { display: flex; gap: 8px; }
        .quick-btns button { flex: 1; padding: 15px 0; font-size: 0.9rem; }
        .btn-push { background-color: var(--accent-green); }
        .btn-behind { background-color: var(--accent-yellow); }
        .btn-box { background-color: var(--accent-red); color: #fff; }

        .custom-msg { display: flex; gap: 8px; }
        .custom-msg input[type="text"] { flex-grow: 1; }
        .custom-msg input[type="color"] { 
            width: 50px; height: 43px; padding: 2px; 
            border: 1px solid var(--border); border-radius: 6px; background: #000;
        }
        .custom-msg button { background-color: #f97316; color: #fff; width: 80px; }
    </style>
</head>
<body>

    <!-- Overlay per l'effetto Flash di invio -->
    <div id="flashOverlay"></div>

    <!-- Header -->
    <header>
        <div id="sessionStatus">⏱️ Waiting for connection...</div>
        <div class="header-actions">
            <span id="pairStatus">UNPAIRED</span>
            <button class="btn-icon" id="toggleSettingsBtn" onclick="toggleSettings()">⚙️</button>
        </div>
        
        <div id="settingsPanel" class="collapsed">
            <div class="input-group">
                <input type="text" id="deviceIdInput" placeholder="PIT-XXXX" onchange="pairDevice()">
                <input type="text" id="myRaceNumber" placeholder="MY#">
            </div>
            <div class="input-group">
                <input type="text" id="raceLinkInput" placeholder="Paste Race Link (Ficr, Mylaps, MGM...)">
                <button id="loadBtn" onclick="loadNewRace()">LOAD</button>
            </div>
            <select id="driverSelect"><option value="">Select Rider...</option></select>
            <select id="targetSelect"><option value="">Select Target...</option></select>
            <button id="stopBtn" onclick="stopSession()">STOP SESSION</button>
        </div>
    </header>

    <div id="mainContentWrapper">
        <div id="liveTimingContainer">
            <table id="liveTimingTable">
                <thead>
                    <tr>
                        <th class="col-pos">P</th>
                        <th class="col-num">#</th>
                        <th class="col-name">NAME</th>
                        <th>LAST</th>
                        <th>BEST</th>
                        <th>GAP</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Popolato via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div id="bottomControls">
        <div class="quick-btns">
            <button class="btn-push" onclick="sendPitCommand('PUSH', '#00FF00')">PUSH</button>
            <button class="btn-behind" onclick="sendPitCommand('RIDER BEHIND', '#FFCC00')">RIDER BEHIND</button>
            <button class="btn-box" onclick="sendPitCommand('BOX', '#FF0000')">BOX</button>
        </div>
        <div class="custom-msg">
            <input type="text" id="customTextInput" placeholder="TYPE MESSAGE...">
            <input type="color" id="customColorPicker" value="#ff8800">
            <button onclick="sendCustomMessage()">SEND</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <script src="app.js"></script>
</body>
</html>
