<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080b10">
  <title>GiroVeloce Pitboard Simulator</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #111720;
      --panel-2: #171f2a;
      --line: #293341;
      --muted: #91a0b2;
      --text: #f5f7fa;
      --cyan: #11c5e8;
      --yellow: #ffca05;
      --green: #19c66b;
      --red: #ef4444;
      --orange: #ff9811;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 750;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .topbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px clamp(12px, 2vw, 24px);
      background: #11161e;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      width: 10px;
      height: 30px;
      border-radius: 6px;
      background: var(--yellow);
    }

    .brand-title {
      font-size: clamp(.8rem, 1.5vw, 1rem);
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .device-id {
      color: var(--cyan);
      font-size: .75rem;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: .72rem;
      white-space: nowrap;
    }

    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 10px currentColor;
    }

    .connection.online { color: var(--green); }
    .connection.online .led { background: var(--green); }
    .connection.offline { color: var(--red); }
    .connection.offline .led { background: var(--red); }

    .session {
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
    }

    .session strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .fullscreen-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 1.2rem;
    }

    .fullscreen-btn:active {
      background: var(--yellow);
      color: #111;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px clamp(10px, 2vw, 20px) 0;
    }

    .tab {
      flex: 1;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px 10px 0 0;
      background: var(--panel);
      color: var(--muted);
      letter-spacing: .06em;
      font-size: .78rem;
      font-weight: 900;
    }

    .tab.active {
      color: #111;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    main {
      min-height: 0;
      flex: 1;
      padding: 10px clamp(10px, 2vw, 20px) 14px;
    }

    .screen {
      display: none;
      height: 100%;
      min-height: 0;
      gap: 10px;
    }

    .screen.active { display: flex; }
    .race-screen { flex-direction: column; }

    .race-primary {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      gap: 10px;
    }

    .card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eyebrow {
      position: absolute;
      top: 13px;
      left: 16px;
      color: var(--muted);
      font-size: clamp(.65rem, 1.15vw, .82rem);
      letter-spacing: .1em;
      font-weight: 900;
    }

    .position {
      color: var(--yellow);
      font-size: clamp(4rem, 14vh, 8.5rem);
      line-height: .95;
      font-variant-numeric: tabular-nums;
    }

    .delta {
      font-size: clamp(2.5rem, 9vh, 5rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .delta.positive { color: var(--orange); }
    .delta.negative { color: var(--red); }

    .track-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px clamp(12px, 3vw, 36px) 12px;
    }

    .track-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .rider {
      text-align: center;
      min-width: 0;
    }

    .rider-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .12em;
    }

    .rider-num {
      display: block;
      color: var(--cyan);
      font-size: clamp(1.8rem, 6vh, 3.5rem);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .track-center {
      color: var(--yellow);
      font-size: clamp(1.2rem, 3vw, 2rem);
      white-space: nowrap;
    }

    .track-center strong {
      color: var(--text);
      font-size: clamp(1.5rem, 4.5vh, 2.5rem);
    }

    .target-screen { flex-direction: column; }

    .target-top {
      flex: 1.15;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(100px, .7fr) minmax(0, 2.3fr);
      gap: 10px;
    }

    .me-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--yellow);
      color: #111;
    }

    .me-card .eyebrow { color: #4b3b00; }

    .me-pos {
      font-size: clamp(3.5rem, 12vh, 7rem);
      line-height: 1;
    }

    .target-card {
      display: flex;
      align-items: center;
      padding: 16px clamp(12px, 3vw, 30px);
    }

    .target-identity { min-width: 0; }

    .target-pos {
      color: var(--yellow);
      font-size: clamp(3rem, 10vh, 6.4rem);
      line-height: 1;
      white-space: nowrap;
    }

    .target-number {
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(.85rem, 1.6vw, 1.15rem);
    }

    .target-times {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      margin-left: auto;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .target-last { font-size: clamp(1.2rem, 4.4vh, 2.8rem); }
    .target-best { color: var(--cyan); font-size: clamp(.95rem, 3.2vh, 2rem); }

    .gap-row {
      z-index: 1;
      display: flex;
      justify-content: center;
      margin: -2px 0;
    }

    .gap-pill {
      padding: 8px 20px;
      border: 1px solid #3b4a5d;
      border-radius: 999px;
      background: #0b1017;
      color: var(--text);
      font-size: clamp(.9rem, 2.5vh, 1.4rem);
      font-variant-numeric: tabular-nums;
    }

    .pace-card {
      min-height: 0;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px clamp(16px, 3vw, 34px);
      background: #111820;
      border: 1px solid #334252;
      border-radius: 14px;
    }

    .pace-copy {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .pace-state {
      color: var(--muted);
      font-size: clamp(1.3rem, 5vh, 3rem);
      letter-spacing: .04em;
    }

    .pace-caption {
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .1em;
    }

    .pace-value {
      font-size: clamp(2.7rem, 9vh, 5.4rem);
      font-variant-numeric: tabular-nums;
    }

    .pace-card.in-pit {
      justify-content: center;
      border-color: var(--cyan);
      background: #05090d;
    }

    .pace-card.in-pit .pace-copy { align-items: center; }

    .pace-card.in-pit .pace-state {
      color: #fff;
      font-size: clamp(2.5rem, 10vh, 6rem);
      font-weight: 950;
      letter-spacing: .08em;
    }

    .pace-card.in-pit .pace-caption,
    .pace-card.in-pit .pace-value {
      display: none;
    }

    #popup {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 950;
      text-transform: uppercase;
      text-shadow: 0 2px 10px #000;
    }

    .footer {
      padding: 4px 12px max(8px, env(safe-area-inset-bottom));
      text-align: center;
      color: #627082;
      font-size: .65rem;
      letter-spacing: .06em;
    }

    @media (orientation: portrait) {
      .topbar {
        min-height: 50px;
        gap: 6px;
        padding-inline: 10px;
      }

      .brand { gap: 7px; }
      .brand-mark { height: 24px; width: 7px; }
      .brand-title { font-size: .65rem; letter-spacing: .06em; }
      .device-id { font-size: .62rem; }
      .connection { font-size: .62rem; gap: 5px; }
      .session { gap: 7px; font-size: .67rem; }
      .fullscreen-btn { width: 30px; height: 30px; }

      .tabs { padding-inline: 8px; padding-top: 8px; }
      .tab { min-height: 38px; font-size: .68rem; }

      main { overflow-y: auto; padding: 8px; }

      .screen {
        min-height: 460px;
        height: 100%;
        gap: 8px;
      }

      .race-primary {
        grid-template-columns: 1fr 1.15fr;
        gap: 8px;
      }

      .track-card { padding: 28px 8px 10px; }
      .track-grid { grid-template-columns: 1fr; gap: 8px; }
      .track-center { order: -1; text-align: center; }
      .rider-label { margin-bottom: 2px; font-size: .65rem; }
      .rider-num { font-size: 1.5rem; }

      .position { font-size: clamp(4rem, 15vw, 6rem); }
      .delta { font-size: clamp(2rem, 9vw, 3.6rem); }

      .target-top {
        grid-template-columns: minmax(76px, .65fr) minmax(0, 2.35fr);
        gap: 8px;
      }

      .target-card { padding: 12px 9px; }
      .me-pos { font-size: clamp(3rem, 12vw, 5rem); }
      .target-pos { font-size: clamp(2rem, 9vw, 4rem); }
      .target-number { font-size: .72rem; }
      .target-times { gap: 6px; }
      .target-last { font-size: clamp(.95rem, 4.2vw, 1.5rem); }
      .target-best { font-size: clamp(.78rem, 3.5vw, 1.2rem); }

      .gap-pill { font-size: .85rem; padding: 7px 14px; }
      .pace-state { font-size: clamp(1.4rem, 7vw, 2.4rem); }
      .pace-value { font-size: clamp(2.4rem, 12vw, 4rem); }

      .pace-card.in-pit .pace-state {
        font-size: clamp(2.5rem, 13vw, 4.8rem);
      }
    }

    @media (max-height: 420px) and (orientation: landscape) {
      .topbar { min-height: 42px; padding-block: 4px; }
      .tabs { padding-top: 5px; }
      .tab { min-height: 32px; }
      main { padding-block: 6px; }
      .screen { gap: 6px; }
      .race-primary, .target-top { gap: 6px; }
      .eyebrow { top: 8px; left: 10px; }
      .target-number { margin-top: 3px; }
      .target-times { gap: 4px; }
      .gap-pill { padding-block: 4px; }
      .footer { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-title">GIROVELOCE PITBOARD</span>
      <span class="device-id" id="simIdDisplay">PIT-S---</span>
    </div>

    <div class="connection" id="connStatus" role="status" aria-live="polite">
      <span class="led"></span>
      <span>CONNECTING</span>
    </div>

    <div class="session">
      <span>SESSION <strong id="ui-time">--:--</strong></span>
      <span>LAPS <strong id="ui-laps">--</strong></span>
    </div>

    <button
      class="fullscreen-btn"
      id="fullscreenBtn"
      type="button"
      aria-label="Enter fullscreen"
      title="Fullscreen"
    >⛶</button>
  </header>

  <nav class="tabs" aria-label="Display screen">
    <button class="tab active" id="btnRace" type="button" aria-selected="true">RACE MODE</button>
    <button class="tab" id="btnTarget" type="button" aria-selected="false">TARGET HUNT</button>
  </nav>

  <main>
    <section id="view-race" class="screen race-screen active" aria-label="Race mode">
      <div class="race-primary">
        <article class="card metric">
          <span class="eyebrow">POSITION</span>
          <span class="position" id="ui-pos">P-</span>
        </article>

        <article class="card metric">
          <span class="eyebrow">BEST LAP DELTA</span>
          <span class="delta" id="ui-gap">--</span>
        </article>
      </div>

      <article class="card track-card">
        <span class="eyebrow">TRACK POSITION</span>
        <div class="track-grid">
          <div class="rider">
            <span class="rider-label">BEHIND</span>
            <span class="rider-num" id="ui-behind">--</span>
          </div>

          <div class="track-center">
            <span>‹</span> <strong id="ui-num">--</strong> <span>›</span>
          </div>

          <div class="rider">
            <span class="rider-label">AHEAD</span>
            <span class="rider-num" id="ui-ahead">--</span>
          </div>
        </div>
      </article>
    </section>

    <section id="view-target" class="screen target-screen" aria-label="Target hunt">
      <div class="target-top">
        <article class="card me-card">
          <span class="eyebrow">RIDER</span>
          <span class="me-pos" id="th-me-pos">P-</span>
        </article>

        <article class="card target-card">
          <span class="eyebrow">TARGET</span>

          <div class="target-identity">
            <div class="target-pos" id="th-tgt-pos">P-</div>
            <div class="target-number" id="th-tgt-num">#--</div>
          </div>

          <div class="target-times">
            <div class="target-last" id="th-tgt-l">LAST --:--.---</div>
            <div class="target-best" id="th-tgt-b">BEST --:--.---</div>
          </div>
        </article>
      </div>

      <div class="gap-row">
        <div class="gap-pill" id="th-bgap">TARGET GAP: --</div>
      </div>

      <article class="pace-card" id="th-banner">
        <div class="pace-copy">
          <span class="pace-state" id="th-banner-text">--</span>
          <span class="pace-caption" id="th-banner-pace">PACE DELTA</span>
        </div>
        <span class="pace-value" id="th-banner-val">--</span>
      </article>
    </section>
  </main>

  <div id="popup" role="alert"></div>
  <footer class="footer">SIMULATOR · MQTT LIVE FEED</footer>

  <script>
    'use strict';

    const $ = id => document.getElementById(id);
    const simId = localStorage.getItem('pitboardSimId') ||
      `PIT-S${Math.floor(Math.random() * 900 + 100)}`;

    localStorage.setItem('pitboardSimId', simId);
    $('simIdDisplay').textContent = simId;

    const topics = {
      command: `pitboard/${simId}/command`,
      live: `pitboard/${simId}/live`
    };

    const brokers = [
      { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' },
      { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' }
    ];

    const clients = [];
    let popupTimer;
    let activeView = 'race';

    function setConnection(name, state) {
      const el = $('connStatus');
      el.className = `connection ${state}`;
      el.lastElementChild.textContent = name;
    }

    function switchTab(view) {
      activeView = view;

      $('view-race').classList.toggle('active', view === 'race');
      $('view-target').classList.toggle('active', view === 'target');
      $('btnRace').classList.toggle('active', view === 'race');
      $('btnTarget').classList.toggle('active', view === 'target');

      $('btnRace').setAttribute('aria-selected', String(view === 'race'));
      $('btnTarget').setAttribute('aria-selected', String(view === 'target'));
    }

    $('btnRace').addEventListener('click', () => switchTab('race'));
    $('btnTarget').addEventListener('click', () => switchTab('target'));

    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock) return;

      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
        });
      } catch (error) {
        console.info('Screen Wake Lock is unavailable', error);
      }
    }

    async function enableDisplayMode() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else if (
          !document.fullscreenElement &&
          document.documentElement.webkitRequestFullscreen
        ) {
          document.documentElement.webkitRequestFullscreen();
        }
      } catch (error) {
        console.info('Fullscreen is unavailable in this browser', error);
      }

      await requestWakeLock();
    }

    $('fullscreenBtn').addEventListener('click', enableDisplayMode);

    document.addEventListener('fullscreenchange', () => {
      $('fullscreenBtn').setAttribute(
        'aria-label',
        document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen'
      );
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    function resetDisplay() {
      ['ui-pos', 'th-me-pos', 'th-tgt-pos'].forEach(id => {
        $(id).textContent = 'P-';
      });

      ['ui-gap', 'ui-behind', 'ui-ahead', 'ui-num'].forEach(id => {
        $(id).textContent = '--';
      });

      $('ui-time').textContent = '--:--';
      $('ui-laps').textContent = '--';
      $('th-tgt-num').textContent = '#--';
      $('th-tgt-l').textContent = 'LAST --:--.---';
      $('th-tgt-b').textContent = 'BEST --:--.---';
      $('th-bgap').textContent = 'TARGET GAP: --';
      $('th-banner-text').textContent = '--';
      $('th-banner-val').textContent = '--';
      $('th-banner').classList.remove('in-pit');
      $('th-banner').style.background = '';
      $('th-banner-text').style.color = '';
    }

    function showCommand(data) {
      const popup = $('popup');
      popup.textContent = String(data.cmd || 'MESSAGE').slice(0, 60);

      popup.style.backgroundColor =
        /^#[0-9a-f]{3,8}$/i.test(data.color || '')
          ? data.color
          : '#101820';

      popup.style.display = 'flex';
      clearTimeout(popupTimer);

      popupTimer = setTimeout(() => {
        popup.style.display = 'none';
      }, 4000);
    }

    function renderLive(data) {
      if (Number(data.cbb) === 2) {
        resetDisplay();
        return;
      }

      const pos =
        data.p && data.p !== '-' && data.p !== '0'
          ? `P${data.p}`
          : 'P-';

      $('ui-pos').textContent = pos;
      $('th-me-pos').textContent = pos;
      $('ui-num').textContent = data.num || '--';
      $('ui-gap').textContent = data.gap || '--';

      $('ui-gap').classList.toggle(
        'positive',
        String(data.gap || '').startsWith('+')
      );

      $('ui-gap').classList.toggle(
        'negative',
        String(data.gap || '').startsWith('-')
      );

      $('ui-ahead').textContent = data.ahead || '--';
      $('ui-behind').textContent = data.behind || '--';
      $('ui-time').textContent = data.time || '--:--';
      $('ui-laps').textContent = data.laps || '--';

      $('th-tgt-num').textContent = data.time_b_bl
        ? `#${String(data.time_b_bl).replace(/^#/, '')}`
        : '#--';

      $('th-tgt-pos').textContent =
        data.time_b_ll && data.time_b_ll !== '-'
          ? `P${data.time_b_ll.replace(/^P/, '')}`
          : 'P-';

      $('th-tgt-l').textContent = `LAST ${data.time_a_ll || '--:--.---'}`;
      $('th-tgt-b').textContent = `BEST ${data.time_a_bl || '--:--.---'}`;

      $('th-bgap').textContent =
        `TARGET GAP: ${data.ahead_html || data.gap_a || '--'}`;

      $('th-banner-val').textContent =
        data.behind_html || data.gap_b || '--';

      const banner = $('th-banner');
      const pit = Number(data.target_pit) === 1 || data.target_pit === true;

      banner.classList.toggle('in-pit', pit);

      if (pit) {
        $('th-banner-text').textContent = 'IN PIT';
        $('th-banner-pace').textContent = '';
        $('th-banner-val').textContent = '';
        banner.style.background = '';
        $('th-banner-text').style.color = '';
      } else {
        $('th-banner-pace').textContent = 'PACE DELTA';

        if (Number(data.cab) === 1) {
          banner.style.background = '#8f1721';
          $('th-banner-text').textContent = 'CATCHING';
          $('th-banner-text').style.color = '#fff';
          $('th-banner-val').style.color = '#fff';
        } else if (Number(data.cab) === 2) {
          banner.style.background = '#ff9811';
          $('th-banner-text').textContent = 'LOSING';
          $('th-banner-text').style.color = '#111';
          $('th-banner-val').style.color = '#111';
        } else {
          banner.style.background = '';
          $('th-banner-text').textContent = 'PACE';
          $('th-banner-text').style.color = '';
          $('th-banner-val').style.color = '';
        }
      }
    }

    function onMessage(topic, message) {
      try {
        const data = JSON.parse(message.toString());

        if (topic === topics.command) {
          showCommand(data);
        } else if (topic === topics.live) {
          renderLive(data);
        }
      } catch (error) {
        console.warn('Ignored invalid MQTT message', error);
      }
    }

    function connectBroker(broker, index) {
      const clientId =
        `GVSim_${index}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;

      const client = mqtt.connect(broker.url, {
        clientId,
        reconnectPeriod: 3000,
        connectTimeout: 10000,
        clean: true,
        keepalive: 30
      });

      clients.push(client);

      client.on('connect', () => {
        client.subscribe([topics.command, topics.live], { qos: 0 }, error => {
          if (error) console.warn(`${broker.name} subscribe failed`, error);
        });

        setConnection(`${broker.name.toUpperCase()} ONLINE`, 'online');
      });

      client.on('reconnect', () => {
        if (!clients.some(c => c.connected)) {
          setConnection('RECONNECTING', '');
        }
      });

      client.on('offline', () => {
        if (!clients.some(c => c.connected)) {
          setConnection('OFFLINE · RETRYING', 'offline');
        }
      });

      client.on('error', error => {
        console.warn(`${broker.name} MQTT error`, error);
      });

      client.on('message', onMessage);
    }

    if (window.mqtt) {
      brokers.forEach(connectBroker);
    } else {
      setConnection('MQTT LIBRARY UNAVAILABLE', 'offline');
    }

    window.addEventListener('beforeunload', () => {
      clients.forEach(client => client.end(true));

      if (wakeLock) {
        wakeLock.release();
      }
    });
  </script>
</body>
</html>
