<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pitboard Live Simulator</title>
  
 <!-- NUOVO MOTORE: MQTT.js (Infallibile) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <script>
    // 1. Configurazione della Radio
    const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
    const clientId = "Sim_S23_" + parseInt(Math.random() * 100000);
    
    document.getElementById('connStatus').innerText = "🟡 CONNESSIONE 4G...";
    document.getElementById('connStatus').style.color = "#ffcc00";

    // Avvia la connessione in modo automatico e invisibile
    const client = mqtt.connect(brokerUrl, {
      clientId: clientId,
      reconnectPeriod: 3000 // Se cade la linea, riprova ogni 3 secondi da solo
    });

    let popupTimer = null;

    // 2. Quando il semaforo diventa Verde
    client.on('connect', function () {
      document.getElementById('connStatus').innerText = "🟢 4G ONLINE TM";
      document.getElementById('connStatus').style.color = "#22c55e";
      // Ascolta i canali della tua pitboard
      client.subscribe("milo/pitboard/command");
      client.subscribe("milo/pitboard/live");
    });

    // 3. Gestione Errori e Disconnessioni (ora è gestita nativamente)
    client.on('error', function (err) {
      document.getElementById('connStatus').innerText = "🔴 ERRORE: " + err.message;
      document.getElementById('connStatus').style.color = "#ef4444";
    });

    client.on('offline', function() {
      document.getElementById('connStatus').innerText = "🔴 OFFLINE - RICERCA RETE...";
      document.getElementById('connStatus').style.color = "#ef4444";
    });

    // 4. Arrivo dei dati in tempo reale
    client.on('message', function (topic, message) {
      try {
        const payload = message.toString();
        const data = JSON.parse(payload);
        
        if (topic === "milo/pitboard/command") {
          const popup = document.getElementById('popup');
          popup.innerText = data.cmd || "ERROR";
          popup.style.backgroundColor = data.color || "#000";
          popup.style.color = (data.color === "#ffcc00") ? "#000" : "#fff";
          popup.style.display = "flex";
          
          if (popupTimer) clearTimeout(popupTimer);
          popupTimer = setTimeout(() => { popup.style.display = "none"; }, 4000);
        }
        else if (topic === "milo/pitboard/live") {
          if (document.getElementById('popup').style.display === "flex") return;
          document.getElementById('ui-pos').innerText = data.p === 0 ? "P-" : "P" + data.p;
          document.getElementById('ui-gap').innerText = data.gap || "--";
          document.getElementById('ui-behind').innerText = data.behind || "--";
          document.getElementById('ui-ahead').innerText = data.ahead || "--";
        }
      } catch(e) {
        console.log("Errore pacchetto:", e);
      }
    });
  </script>
</body>
</html>
