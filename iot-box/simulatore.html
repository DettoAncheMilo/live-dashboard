<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pitboard Live Simulator</title>
  
  <!-- Libreria MQTT per la radio -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>

  <style>
    /* RESET BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* STATUS BAR (Finta batteria e 4G) */
    .status-bar {
      height: 25px;
      background-color: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-size: 0.8rem;
      color: #aaa;
      font-weight: bold;
    }
    .battery {
      display: flex;
      align-items: center;
    }
    .battery-icon {
      width: 30px; height: 12px;
      border: 2px solid #fff;
      border-radius: 2px;
      margin-left: 5px;
      position: relative;
      background: linear-gradient(90deg, #22c55e 75%, transparent 75%);
    }
    .battery-icon::after {
      content: ''; position: absolute; right: -4px; top: 2px;
      width: 2px; height: 4px; background: #fff;
    }

    /* GRIGLIA PRINCIPALE */
    .dashboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }
    .row-top {
      display: flex;
      flex: 1;
      gap: 10px;
    }
    .box {
      border: 3px solid #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .box-half { flex: 1; }
    .box-full { flex: 1; display: flex; flex-direction: column; }

    /* TESTI E TITOLI */
    .title {
      position: absolute;
      top: 10px;
      color: #777;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    
    .val-pos { color: #ffcc00; font-size: 6rem; font-weight: bold; margin-top: 15px; }
    .val-gap { color: #ef4444; font-size: 4.5rem; font-weight: bold; margin-top: 15px; }
    
    /* TRACK POSITION AREA */
    .track-pos-container {
      display: flex;
      width: 100%;
      justify-content: space-around;
      align-items: center;
      margin-top: 25px;
    }
    .track-col { display: flex; flex-direction: column; align-items: center; }
    .track-title { color: #555; font-size: 1rem; font-weight: bold; margin-bottom: 5px; }
    .val-track { color: #06b6d4; font-size: 2.5rem; font-weight: bold; }
    .arrows { display: flex; align-items: center; gap: 15px; font-size: 3rem; color: #ffcc00; }
    .dashes { color: #fff; font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; }

    /* POP-UP EMERGENZA A TUTTO SCHERMO */
    #popup {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none; /* Nascosto di default */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 8rem;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- STATO IN ALTO -->
  <div class="status-bar">
    <span id="connStatus">🔴 OFFLINE - 4G TM</span>
    <div class="battery">85% <div class="battery-icon"></div></div>
  </div>

  <!-- CRUSCOTTO -->
  <div class="dashboard">
    
    <div class="row-top">
      <div class="box box-half">
        <div class="title">POSITION</div>
        <div class="val-pos" id="ui-pos">P-</div>
      </div>
      <div class="box box-half">
        <div class="title">GAP TO LEADER</div>
        <div class="val-gap" id="ui-gap">--</div>
      </div>
    </div>

    <div class="box box-full">
      <div class="title">TRACK POSITION</div>
      <div class="track-pos-container">
        <div class="track-col">
          <div class="track-title">BEHIND</div>
          <div class="val-track" id="ui-behind">--</div>
        </div>
        
        <div class="arrows">
          <span>&#9664;</span> <!-- Freccia Gialla Sinistra -->
          <span class="dashes">--</span>
          <span>&#9654;</span> <!-- Freccia Gialla Destra -->
        </div>

        <div class="track-col">
          <div class="track-title">AHEAD</div>
          <div class="val-track" id="ui-ahead">--</div>
        </div>
      </div>
    </div>

  </div>

  <!-- OVERLAY CARTELLO BOX -->
  <div id="popup">MSG</div>

  <!-- MOTORE LOGICO -->
  <script>
    // 1. Configurazione Radio
    const broker = "broker.hivemq.com";
    const port = 8884;
    const client = new Paho.MQTT.Client(broker, port, "SimulatoreS23_" + parseInt(Math.random() * 100));
    let popupTimer = null;

    // 2. Eventi Connessione
    client.onConnectionLost = function(responseObject) {
      document.getElementById('connStatus').innerText = "🔴 CONNESSIONE PERSA - RICERCA RETE...";
      document.getElementById('connStatus').style.color = "#ef4444";
      setTimeout(connect, 3000);
    };

    // 3. Arrivo Messaggi (Il cervello del C++ tradotto in JS!)
    client.onMessageArrived = function(message) {
      const topic = message.destinationName;
      const payload = message.payloadString;

      try {
        const data = JSON.parse(payload);

        // A. COMANDO DAL MURETTO
        if (topic === "milo/pitboard/command") {
          const popup = document.getElementById('popup');
          popup.innerText = data.cmd || "ERROR";
          popup.style.backgroundColor = data.color || "#000";
          popup.style.color = (data.color === "#ffcc00") ? "#000" : "#fff";
          
          popup.style.display = "flex"; // Accende a tutto schermo
          
          // Spegne dopo 4 secondi (esattamente come il delay del C++)
          if (popupTimer) clearTimeout(popupTimer);
          popupTimer = setTimeout(() => {
            popup.style.display = "none";
          }, 4000);
        }
        
        // B. DATI TELEMETRIA LIVE
        else if (topic === "milo/pitboard/live") {
          // Ignoriamo la telemetria se c'è il popup a schermo
          if (document.getElementById('popup').style.display === "flex") return;
          
          // Inietta i dati nei box grafici
          document.getElementById('ui-pos').innerText = data.p === 0 ? "P-" : "P" + data.p;
          document.getElementById('ui-gap').innerText = data.gap || "--";
          document.getElementById('ui-behind').innerText = data.behind || "--";
          document.getElementById('ui-ahead').innerText = data.ahead || "--";
        }

      } catch(e) { console.log("Errore parsing JSON"); }
    };

    // Avvia la connessione
    function connect() {
      document.getElementById('connStatus').innerText = "🟡 CONNESSIONE 4G...";
      document.getElementById('connStatus').style.color = "#ffcc00";
      
      client.connect({
        useSSL: true,
        onSuccess: function() {
          document.getElementById('connStatus').innerText = "🟢 4G ONLINE TM";
          document.getElementById('connStatus').style.color = "#22c55e";
          // Mi iscrivo ai canali in ascolto
          client.subscribe("milo/pitboard/command");
          client.subscribe("milo/pitboard/live");
        }
      });
    }

    // Parte tutto all'apertura
    connect();
  </script>
</body>
</html>
