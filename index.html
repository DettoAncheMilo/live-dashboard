<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pit Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #050505; color: #ffffff; font-family: 'Arial Black', sans-serif; padding: 10px; height: 100vh; display: flex; flex-direction: column; }
    
    .header { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #151515; border-radius: 8px; margin-bottom: 10px; }
    .input-row { display: flex; width: 100%; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
    button { padding: 10px 15px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    
    .select-row { display: flex; width: 100%; justify-content: space-between; align-items: center; }
    select { font-size: 1.1rem; padding: 6px 12px; background: #252525; color: #fff; border: 1px solid #444; border-radius: 6px; font-weight: bold; max-width: 60%; }
    
    .session-status { text-align: center; font-size: 1.2rem; font-weight: bold; color: white; padding: 10px; background: #1a1a1a; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1.2fr; gap: 10px; flex: 1; }
    
    .card { background: #111; border: 2px solid #222; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .card-full { grid-column: span 2; background: #111; border: 2px solid #222; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 25px 10px 10px 10px; }
    
    .label { font-size: 1.2rem; color: #888; text-transform: uppercase; position: absolute; top: 10px; }
    .value { font-weight: 900; margin-top: 15px; }
    
    .pos { color: #ffcc00; font-size: 6rem; }
    .gap { color: #ff1744; font-size: 5rem; }
    
    /* STILI RADAR PISTA */
    .radar-container { display: flex; width: 100%; justify-content: space-between; align-items: center; height: 100%; }
    .radar-item { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
    .radar-title { color: #555; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
    
    .radar-center { display: flex; align-items: center; justify-content: center; flex: 1; height: 100%; }
    .you-box { display: flex; align-items: center; justify-content: center; gap: 15px; }
    .you-text { color: #fff; font-size: 3.5rem; font-weight: 900; letter-spacing: 1px; }
    .arrow { color: #ffcc00; font-size: 2.5rem; }
    
    .rival { color: #00e5ff; font-size: 2rem; display: flex; flex-direction: column; text-align: center; line-height: 1.1; margin-top: 0; }
    .rival-num { color: #fff; font-size: 2rem; }
  </style>
</head>
<body>
  <div class="header">
    <div class="input-row">
      <input type="text" id="raceLinkInput" placeholder="Paste link here...">
      <button onclick="loadNewRace()">Carica</button>
    </div>
    <div class="select-row">
      <span style="color:#888; font-size:0.9rem;">LIVE TIMING</span>
      <select id="driverSelect">
        <option value="">Seleziona Pilota...</option>
      </select>
    </div>
  </div>

  <div id="sessionStatus" class="session-status">⏱️ In attesa di connessione...</div>

  <div class="grid">
    <div class="card"><span class="label">Posizione</span><span class="value pos" id="pos">P-</span></div>
    <div class="card"><span class="label">Distacco Leader</span><span class="value gap" id="gap">+0.0</span></div>
    
    <div class="card-full">
      <span class="label">Radar Pista</span>
      <div class="radar-container">
        
        <div class="radar-item">
          <span class="radar-title">Dietro</span>
          <span class="value rival" id="driverBehind">--</span>
        </div>
        
        <div class="radar-center">
          <div class="you-box">
            <span class="arrow">◀</span>
            <span class="you-text" id="myDriverNum">#--</span>
            <span class="arrow">▶</span>
          </div>
        </div>

        <div class="radar-item">
          <span class="radar-title">Avanti</span>
          <span class="value rival" id="driverAhead">--</span>
        </div>
        
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
