<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pit Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #050505; color: #ffffff; font-family: 'Arial Black', sans-serif; padding: 10px; height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #151515; border-radius: 8px; margin-bottom: 10px; }
    .input-row { display: flex; width: 100%; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; }
    button { padding: 10px 15px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    .select-row { display: flex; width: 100%; justify-content: space-between; align-items: center; }
    select { font-size: 1.1rem; padding: 6px 12px; background: #252525; color: #fff; border: 1px solid #444; border-radius: 6px; font-weight: bold; max-width: 60%; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; flex: 1; }
    .card { background: #111; border: 2px solid #222; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .label { font-size: 1.2rem; color: #888; text-transform: uppercase; position: absolute; top: 10px; }
    .value { font-size: 4.5rem; font-weight: 900; margin-top: 15px; }
    .pos { color: #ffcc00; font-size: 6rem; }
    .last { color: #00e5ff; }
    .best { color: #d500f9; }
    .gap { color: #ff1744; }
  </style>
</head>
<body>
  <div class="header">
    <div class="input-row">
      <input type="text" id="raceLinkInput" placeholder="Incolla link gara (es: https://stg.mk.time2race.it/race/24/)">
      <button onclick="loadNewRace()">Carica</button>
    </div>
    <div class="select-row">
      <span style="color:#888; font-size:0.9rem;">LIVE TIMING</span>
      <select id="driverSelect" onchange="changeDriver(this.value)">
        <option value="">Seleziona Pilota...</option>
      </select>
    </div>
  </div>

  <div class="grid">
    <div class="card"><span class="label">Posizione</span><span class="value pos" id="pos">P-</span></div>
    <div class="card"><span class="label">Ultimo Giro</span><span class="value last" id="lastLap">--:--.--</span></div>
    <div class="card"><span class="label">Miglior Giro</span><span class="value best" id="bestLap">--:--.--</span></div>
    <div class="card"><span class="label">Distacco Leader</span><span class="value gap" id="gap">+0.0</span></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
